name: CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.12.17"
  PYTHON_VERSION: "3.12"
  UV_PYTHON_INSTALL_MIRROR: https://github.com/astral-sh/python-build-standalone/releases/download
  NODE_VERSION: "24"
  PNPM_VERSION: "12.5.1"
  CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  BACKEND_IMAGE: jahan-ci-backend:${{ github.run_id }}-${{ github.run_attempt }}
  COMPOSE_PROJECT_NAME: jahan-ci-${{ github.run_id }}-${{ github.run_attempt }}
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

jobs:
  local-backup-protection:
    name: Windows local backup protection
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify DPAPI backup and safe failure behavior
        shell: pwsh
        run: ./scripts/test-local-backup-protection.ps1 -TestDirectory (Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N')))

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          download-from-astral-mirror: false
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync locked dependencies
        run: uv sync --frozen --dev

      - name: Check formatting
        run: uv run ruff format --check app tests

      - name: Lint
        run: uv run ruff check app tests

      - name: Type-check
        run: uv run mypy app tests

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Test frontend foundation
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Public route and asset regression
        working-directory: frontend
        env:
          AUDIT_OUTPUT: ${{ runner.temp }}/public-site-audit.json
          AUDIT_MAX_DESTINATION_JS_GZIP_BYTES: "240000"
        run: |
          node node_modules/next/dist/bin/next start --port 5100 > "$RUNNER_TEMP/public-site-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --silent --fail http://localhost:5100/en > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/public-site-server.log"; exit 1; fi
          pnpm test:public

      - name: Upload public regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-site-audit
          path: |
            ${{ runner.temp }}/public-site-audit.json
            ${{ runner.temp }}/public-site-server.log
          if-no-files-found: ignore

  browser-tests:
    name: Browser and Accessibility Tests
    env:
      ADMIN_STORAGE_ORIGIN: http://localhost:9100
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile


      - name: Build browser test site
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test browser journeys and accessibility
        run: |
          pnpm exec next start --port 5100 > "$RUNNER_TEMP/browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --silent --fail http://localhost:5100/fa > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/browser-server.log
          if-no-files-found: ignore

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          download-from-astral-mirror: false
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync locked dependencies
        run: uv sync --frozen --dev

      - name: Run unit, architecture, and contract tests
        run: uv run pytest tests/unit tests/architecture tests/contract -v

      - name: Test restricted production SSH gateway
        working-directory: .
        run: python -m unittest discover -s deploy/production -p test_ssh_gateway.py -v

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: jahan_academy
          POSTGRES_USER: jahan
          POSTGRES_PASSWORD: jahan_ci
        ports:
          - 127.0.0.1::5432
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=512m
          --health-cmd "pg_isready -U jahan -d jahan_academy"
          --health-start-period 120s
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 127.0.0.1::6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-start-period 120s
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          download-from-astral-mirror: false
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync locked dependencies
        run: uv sync --frozen --dev

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://jahan:jahan_ci@localhost:${{ job.services.postgres.ports['5432'] }}/jahan_academy
        run: uv run alembic -c alembic.ini upgrade head

      - name: Build isolated storage policy test service from pinned upstream source
        run: docker build --file deploy/testing/minio.Dockerfile --tag jahan-ci-minio:policy-test deploy/testing
        working-directory: .

      - name: Start isolated storage policy test service
        run: >-
          docker run --detach --name media-policy-test
          -e MINIO_ROOT_USER=synthetic-local-user
          -e MINIO_ROOT_PASSWORD=synthetic-local-password-only
          -p 127.0.0.1:19200:9000
          jahan-ci-minio:policy-test server /data

      - name: Run integration tests
        env:
          JAHAN_RUN_INTEGRATION: "1"
          JAHAN_ENVIRONMENT: test
          JAHAN_DATABASE_URL: postgresql+asyncpg://jahan:jahan_ci@localhost:${{ job.services.postgres.ports['5432'] }}/jahan_academy
          JAHAN_REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}/0
          JAHAN_SESSION_SECRET: ci-only-secret-that-is-longer-than-32-characters
          # Isolated functional tests share TestClient's synthetic peer address.
          JAHAN_API_RATE_LIMIT: "10000"
          JAHAN_AUTH_IP_LIMIT: "10000"
          JAHAN_AUTH_REFRESH_IP_LIMIT: "10000"
          JAHAN_STORAGE_POLICY_TEST_URL: http://127.0.0.1:19200
        run: uv run pytest tests/integration -v

      - name: Verify latest migration rollback and re-upgrade
        env:
          DATABASE_URL: postgresql+psycopg://jahan:jahan_ci@localhost:${{ job.services.postgres.ports['5432'] }}/jahan_academy
        run: |
          uv run alembic -c alembic.ini downgrade -1
          uv run alembic -c alembic.ini upgrade head

      - name: Restore backup in an isolated database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" pg_dump -U jahan -d jahan_academy -Fc > "$RUNNER_TEMP/restore-test.dump"
          docker exec "$POSTGRES_CONTAINER" createdb -U jahan jahan_restore_test
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U jahan -d jahan_restore_test --exit-on-error < "$RUNNER_TEMP/restore-test.dump"
          docker exec "$POSTGRES_CONTAINER" psql -U jahan -d jahan_restore_test -v ON_ERROR_STOP=1 -c 'SELECT version_num FROM alembic_version; SELECT count(*) FROM users;'
          docker exec "$POSTGRES_CONTAINER" dropdb -U jahan jahan_restore_test

      - name: Verify production operations tooling
        working-directory: .
        env:
          DOCKER_PRODUCTION_TEST: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
          python3 -m unittest discover -s deploy/production -p 'test_*.py' -v
          for file in deploy/production/*.sh; do bash -n "$file"; done

  build:
    name: Build
    needs: [integration-tests, browser-tests, local-backup-protection]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build backend production image
        run: docker build -f backend/Dockerfile -t "${BACKEND_IMAGE}" .

      - name: Smoke-test backend production image
        run: |
          docker run --detach --name "${COMPOSE_PROJECT_NAME}-smoke" --publish 127.0.0.1::8000 "${BACKEND_IMAGE}"
          address=$(docker port "${COMPOSE_PROJECT_NAME}-smoke" 8000/tcp)
          for _ in {1..180}; do
            if curl --fail --silent --connect-timeout 2 --max-time 5 "http://${address}/health/live"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${COMPOSE_PROJECT_NAME}-smoke"
          exit 1

      - name: Stop smoke-test container
        if: always()
        run: docker rm --force "${COMPOSE_PROJECT_NAME}-smoke" 2>/dev/null || true

      - name: Build full Docker Compose stack
        run: docker compose --env-file .env.example build

      - name: Start and verify full Docker Compose stack
        run: |
          docker compose --env-file .env.example up --detach --wait
          address=$(docker compose --env-file .env.example port nginx 80)
          curl --fail --silent "http://${address}/fa" > /dev/null
          curl --fail --silent "http://${address}/en" > /dev/null
          curl --fail --silent "http://${address}/health/ready" > /dev/null
          curl --fail --silent "http://${address}/openapi.json" > /dev/null

      - name: Stop full Docker Compose stack
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

      - name: Remove this run's build images
        if: always()
        run: docker image rm "${BACKEND_IMAGE}" "jahan-ci-frontend:${CI_RUN_ID}" 2>/dev/null || true

  security:
    name: Security Checks
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          download-from-astral-mirror: false
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Export production dependencies
        run: uv export --frozen --no-dev --no-emit-project --output-file requirements-audit.txt

      - name: Audit Python dependencies
        run: uvx --from pip-audit==2.9.0 pip-audit --requirement requirements-audit.txt

      - name: Run Python security static analysis
        run: uvx --from bandit==1.8.6 bandit --recursive app --quiet

      - name: Scan Git history for secrets
        working-directory: .
        run: >-
          docker run --rm --volume "${PWD}:/repo"
          zricethezav/gitleaks:v8.28.0
          detect --source=/repo --redact --verbose

      - name: Build image for vulnerability scanning
        working-directory: .
        run: docker build -f backend/Dockerfile -t "${BACKEND_IMAGE}" .

      - name: Scan image for high and critical vulnerabilities
        working-directory: .
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume jahan-ci-trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.68.2
          image --db-repository ghcr.io/aquasecurity/trivy-db:2
          --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL "${BACKEND_IMAGE}"

      - name: Remove this run's scan image
        if: always()
        working-directory: .
        run: docker image rm "${BACKEND_IMAGE}" 2>/dev/null || true

  publish:
    name: Publish Image
    needs: security
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.registry.outputs.image }}@${{ steps.build-backend.outputs.digest }}
      frontend: ${{ steps.registry.outputs.frontend }}@${{ steps.build-frontend.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set registry and immutable image references
        id: registry
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${GITHUB_REPOSITORY,,}/frontend" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and publish frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.frontend }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  deploy-production:
    name: Deploy Main
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.JAHAN_MAIN_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://jahanacademi.ir
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy verified main digests to the isolated stack
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          MAIN_SHA: ${{ github.sha }}
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend }}
          FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ && "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REGISTRY_USER" =~ ^[a-zA-Z0-9_\[\]-]+$ ]]
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          key="$RUNNER_TEMP/jahan-deploy-key"
          hosts="$RUNNER_TEMP/jahan-known-hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          options=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15)
          remote="$SSH_USER@$SSH_HOST"
          # The server key is forced to ssh-gateway.py: no shell, SCP, or forwarding.
          # The gateway independently checks current main/CI and fetches its official source.
          printf '%s' "$REGISTRY_TOKEN" | ssh "${options[@]}" -p "$SSH_PORT" "$remote" \
            "jahan-deploy $MAIN_SHA $BACKEND_DIGEST $FRONTEND_DIGEST $REGISTRY_USER"
