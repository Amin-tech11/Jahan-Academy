name: Feature
description: Propose a scoped product or engineering feature
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What user or business outcome should change?
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements and references
      description: Link relevant requirement IDs, contracts, designs, or decisions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide observable Given/When/Then or equivalent criteria.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
      description: State what this feature will not include.
