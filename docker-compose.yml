name: ${COMPOSE_PROJECT_NAME:-jahan-academy}

x-backend-environment: &backend-environment
  JAHAN_ENVIRONMENT: local
  JAHAN_LOG_LEVEL: INFO
  JAHAN_DOCS_ENABLED: "true"
  JAHAN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jahan}:${POSTGRES_PASSWORD:-jahan_local_change_me}@postgres:5432/${POSTGRES_DB:-jahan_academy}
  JAHAN_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local_change_me}@redis:6379/0
  JAHAN_SESSION_SECRET: ${JAHAN_SESSION_SECRET:-local-only-change-me-at-least-32-characters}
  JAHAN_COOKIE_SECURE: "false"
  JAHAN_FRONTEND_URL: http://localhost:${NGINX_PORT:-8080}
  JAHAN_NOURA_BASE_URL: http://mock-noura:8090
  JAHAN_NOURA_MOCK_OUTCOME: ${NOURA_MOCK_OUTCOME:-success}
  JAHAN_STORAGE_ENDPOINT_URL: http://minio:9000
  JAHAN_STORAGE_PUBLIC_ENDPOINT_URL: ${JAHAN_STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9100}
  JAHAN_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-jahan_minio}
  JAHAN_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-jahan_minio_change_me}
  JAHAN_MEDIA_QUARANTINE_BUCKET: jahan-quarantine
  JAHAN_MEDIA_PUBLIC_BUCKET: jahan-public
  JAHAN_MALWARE_SCAN_ENABLED: "true"
  JAHAN_CLAMAV_HOST: clamav
  JAHAN_CLAMAV_PORT: "3310"

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jahan_academy}
      POSTGRES_USER: ${POSTGRES_USER:-jahan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jahan_local_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - application

  redis:
    image: redis:8.4.0-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-redis_local_change_me}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_change_me}
    restart: unless-stopped
    networks:
      - application

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jahan_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jahan_minio_change_me}
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - application
      - edge

  minio-init:
    image: jahan-academy-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    command: ["/app/.venv/bin/python", "-m", "app.modules.media.initialize_storage"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - application

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      - application

  migrate:
    image: jahan-academy-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jahan}:${POSTGRES_PASSWORD:-jahan_local_change_me}@postgres:5432/${POSTGRES_DB:-jahan_academy}
    command: ["/app/.venv/bin/alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - application

  backend:
    image: jahan-academy-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - application

  mock-noura:
    image: jahan-academy-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - /app/.venv/bin/uvicorn
      - app.modules.integrations.mock_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - application

  worker-integration:
    image: jahan-academy-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    command:
      - /app/.venv/bin/celery
      - -A
      - app.core.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - --queues=celery
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-noura:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - application

  beat:
    image: jahan-academy-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    command:
      - /app/.venv/bin/celery
      - -A
      - app.core.celery_app:celery_app
      - beat
      - --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-noura:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - application

  frontend:
    image: jahan-academy-frontend:local
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/fa').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - edge
      - application

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d/jahan-academy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/nginx"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks:
      - edge
      - application

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:

networks:
  edge:
  application:
    internal: true
