services:
  worker:
    command: [/app/.venv/bin/celery, -A, app.core.celery_app:celery_app, worker, --loglevel=INFO, --concurrency=2]
    environment:
      JAHAN_SHEETS_BACKUP_ENABLED: "true"
      JAHAN_SHEETS_BACKUP_SPREADSHEET_ID: 1D-OEZf_lO8pym4ZYqBxCjsMYYfG-HG109jMmx2dBK4A
      JAHAN_SHEETS_BACKUP_CREDENTIALS_FILE: /run/secrets/google-service-account.json
    volumes:
      - ${JAHAN_GOOGLE_CREDENTIALS_FILE:?Set the absolute path to the service account JSON}:/run/secrets/google-service-account.json:ro
  backup-beat:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    environment:
      JAHAN_SHEETS_BACKUP_ENABLED: "true"
    command: [/app/.venv/bin/celery, -A, app.core.celery_app:celery_app, beat, --loglevel=INFO]
    networks:
      - application
    restart: unless-stopped
