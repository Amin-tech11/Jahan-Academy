# Isolated existing project/volumes. Never run this against the other site's stack.
name: jahan-academy-test
x-api: &api
  image: ${JAHAN_BACKEND_IMAGE:?An immutable main image is required}
  env_file: [runtime.env]
  restart: unless-stopped
  mem_limit: 384m
  cpus: 0.5
  networks: [private, egress]
services:
  db:
    image: postgres:17-alpine
    env_file: [database.env]
    volumes: [db_data:/var/lib/postgresql/data]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8.4.0-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.2
    networks: [private]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
  migrate:
    <<: *api
    restart: "no"
    command: [/app/.venv/bin/alembic, -c, alembic.ini, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  backend:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  frontend:
    image: ${JAHAN_FRONTEND_IMAGE:?An immutable main image is required}
    env_file: [frontend.env]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    networks: [private]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/fa", {signal: AbortSignal.timeout(4000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
  preview:
    image: nginx:1.28-alpine
    ports: ["5080:80", "127.0.0.1:5081:81"]
    volumes: ["./preview.conf:/etc/nginx/conf.d/default.conf:ro", "./proxy-headers.conf:/etc/nginx/jahan-proxy-headers.conf:ro"]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    networks: [private, edge]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:81/proxy-health]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  db_data:
networks:
  private: {internal: true}
  edge:
  egress:
