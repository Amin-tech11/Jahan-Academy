        entityType: { type: string, enum: [university, program] }
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        score: { type: number, minimum: 0 }
    SuggestionEnvelope:
      type: object
      additionalProperties: false
      required: [data, query, locale]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DiscoverySuggestion' }
        query: { type: string }
        locale: { type: string, enum: [fa, en] }
    RelatedResult:
      allOf:
        - $ref: '#/components/schemas/DiscoverySuggestion'
        - type: object
          required: [reasons]
          properties:
            reasons:
              type: array
              items: { type: string }
    RelatedEnvelope:
      type: object
      additionalProperties: false
      required: [data, locale]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RelatedResult' }
        locale: { type: string, enum: [fa, en] }
    ArticleSummary:
