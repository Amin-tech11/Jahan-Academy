openapi: 3.1.0
info:
  title: Jahan Academy API
  version: 1.0.0-draft
  description: Contract-first API. x-phase identifies MVP and later complete-product operations.
servers:
  - url: /api/v1
tags:
  - name: Reference Data
  - name: Public Catalog
  - name: Consultations
  - name: Staff Authentication
  - name: Lead Operations
  - name: User Authentication
  - name: Applications
  - name: Courses
  - name: Commerce
paths:
  /reference-data/{kind}:
    get:
      tags: [Reference Data]
      operationId: listReferenceData
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: countryId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: parentId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { $ref: '#/components/responses/ReferenceDataPage' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/reference-data/{kind}:
    get:
      tags: [Reference Data]
      operationId: listAdminReferenceData
      x-phase: MVP
      x-permissions: [reference_data.read]
      security: [{ UserAccessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ReferenceDataPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Reference Data]
      operationId: createReferenceData
      x-phase: MVP
      x-permissions: [reference_data.write]
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ReferenceKind' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceDataWrite' }
      responses:
        '201': { $ref: '#/components/responses/ReferenceDataItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/reference-data/{kind}/{id}:
    parameters:
      - $ref: '#/components/parameters/ReferenceKind'
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reference Data]
      operationId: getAdminReferenceData
      x-phase: MVP
      x-permissions: [reference_data.read]
      security: [{ UserAccessToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/ReferenceDataItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Reference Data]
      operationId: replaceReferenceData
      x-phase: MVP
      x-permissions: [reference_data.write]
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceDataWrite' }
      responses:
        '200': { $ref: '#/components/responses/ReferenceDataItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Reference Data]
      operationId: archiveReferenceData
      x-phase: MVP
      x-permissions: [reference_data.write]
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/ReferenceDataItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /countries:
    get:
      tags: [Public Catalog]
      operationId: listCountries
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: featured
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Published countries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CountrySummary' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /countries/{slug}:
    get:
      tags: [Public Catalog]
      operationId: getCountry
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Published country
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryEnvelope'
        '404': { $ref: '#/components/responses/NotFound' }
  /universities:
    get:
      tags: [Public Catalog]
      operationId: listUniversities
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - { name: country, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: ranking, in: query, schema: { type: integer, minimum: 1 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, ranking, -ranking] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/UniversityPage' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /universities/{slug}:
    get:
      tags: [Public Catalog]
      operationId: getUniversity
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Published university details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UniversityDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /programs:
    get:
      tags: [Public Catalog]
      operationId: listPrograms
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - { name: country, in: query, schema: { type: string } }
        - { name: university, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string } }
        - { name: field, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: intake, in: query, schema: { type: string, enum: [SPRING, SUMMER, FALL, WINTER, UNKNOWN] } }
        - { name: tuitionMin, in: query, schema: { type: string, pattern: '^\d+(\.\d{1,2})?$' } }
        - { name: tuitionMax, in: query, schema: { type: string, pattern: '^\d+(\.\d{1,2})?$' } }
        - { name: currency, in: query, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, tuition, -tuition, deadline, -deadline] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ProgramPage' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /programs/{slug}:
    get:
      tags: [Public Catalog]
      operationId: getProgram
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Published program details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProgramDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /articles:
    get:
      tags: [Public Catalog]
      operationId: listArticles
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - { name: category, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ArticlePage' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /articles/{slug}:
    get:
      tags: [Public Catalog]
      operationId: getArticle
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Published article
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ArticleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /consultation-requests:
    post:
      tags: [Consultations]
      operationId: createConsultationRequest
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsultationCreate' }
      responses:
        '200':
          description: Duplicate accepted submission; existing reference returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationReceiptEnvelope' }
        '201':
          description: Consultation request persisted locally
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationReceiptEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /admin/auth/login:
    post:
      tags: [Staff Authentication]
      operationId: loginStaff
      x-phase: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLogin' }
      responses:
        '200':
          description: Authenticated; session and CSRF cookies are set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/auth/logout:
    post:
      tags: [Staff Authentication]
      operationId: logoutStaff
      x-phase: MVP
      security: [{ StaffSession: [], CsrfToken: [] }]
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/auth/me:
    get:
      tags: [Staff Authentication]
      operationId: getCurrentStaff
      x-phase: MVP
      security: [{ StaffSession: [] }]
      responses:
        '200':
          description: Current staff identity and effective permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/leads:
    get:
      tags: [Lead Operations]
      operationId: listLeads
      x-phase: MVP
      x-permissions: [lead.read.all, lead.read.assigned]
      security: [{ StaffSession: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LeadStatus' } }
        - { name: syncStatus, in: query, schema: { $ref: '#/components/schemas/SyncStatus' } }
        - { name: assigneeId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: countryId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: archive, in: query, schema: { type: string, enum: [active, archived, all], default: active } }
        - { name: sort, in: query, schema: { type: string, enum: [created_desc, created_asc, updated_desc], default: created_desc } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Scope-filtered lead page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeadSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/leads/{id}:
    get:
      tags: [Lead Operations]
      operationId: getLead
      x-phase: MVP
      x-permissions: [lead.read.all, lead.read.assigned]
      security: [{ StaffSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Lead details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LeadDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Lead Operations]
      operationId: updateLead
      x-phase: MVP
      x-permissions: [lead.write.all]
      security: [{ StaffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadUpdate' }
      responses:
        '200':
          description: Updated lead with a new ETag
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LeadDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/leads/{id}/archive:
    post:
      tags: [Lead Operations]
      operationId: archiveLead
      x-phase: MVP
      x-permissions: [lead.write.all]
      security: [{ StaffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadArchiveRequest' }
      responses:
        '200':
          description: Archived lead with a new ETag
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LeadDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/leads/{id}/assignments:
    post:
      tags: [Lead Operations]
      operationId: assignLead
      x-phase: MVP
      x-permissions: [lead.assign]
      security: [{ StaffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadAssignmentRequest' }
      responses:
        '200':
          description: Assigned or transferred lead with a new ETag
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LeadDetail' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/leads/{id}/status-transitions:
    post:
      tags: [Lead Operations]
      operationId: transitionLeadStatus
      x-phase: MVP
      x-permissions: [lead.write.all, lead.write.assigned]
      security: [{ StaffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadStatusTransitionRequest' }
      responses:
        '200':
          description: Transitioned lead with a new ETag
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LeadDetail' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /admin/leads/{id}/history:
    get:
      tags: [Lead Operations]
      operationId: getLeadHistory
      x-phase: MVP
      x-permissions: [lead.read.all, lead.read.assigned]
      security: [{ StaffSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Assignment and status history
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LeadHistory' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/leads/{id}/noura-retry:
    post:
      tags: [Lead Operations]
      operationId: retryNouraLeadSync
      x-phase: MVP
      x-permissions: [lead.sync.retry]
      security: [{ StaffSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NouraRetryRequest' }
      responses:
        '202':
          description: Failed Noura synchronization queued for a new retry cycle
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/NouraRetryReceipt' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/register:
    post:
      tags: [User Authentication]
      operationId: registerUser
      x-phase: Final
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRegister' }
      responses:
        '202': { description: Pending user created; verification email requested }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/email-verification-requests:
    post:
      tags: [User Authentication]
      operationId: requestEmailVerification
      x-phase: Final
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { description: Neutral acknowledgement }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/email-verifications:
    post:
      tags: [User Authentication]
      operationId: verifyEmail
      x-phase: Final
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200': { description: Email verified; access token and auth cookies issued }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [User Authentication]
      operationId: loginUser
      x-phase: Final
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserLogin' }
      responses:
        '200': { description: User session established }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [User Authentication]
      operationId: refreshUserSession
      x-phase: Final
      security: [{ RefreshToken: [], CsrfToken: [] }]
      responses:
        '200': { description: Refresh token rotated and new access token issued }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [User Authentication]
      operationId: logoutUser
      x-phase: Final
      security: [{ UserAccessToken: [], CsrfToken: [] }]
      responses:
        '204': { description: Current session revoked and cookies cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/password-reset-requests:
    post:
      tags: [User Authentication]
      operationId: requestPasswordReset
      x-phase: Final
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { description: Neutral acknowledgement }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password-resets:
    post:
      tags: [User Authentication]
      operationId: resetPassword
      x-phase: Final
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirm' }
      responses:
        '204': { description: Password replaced and all sessions revoked }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/me:
    get:
      tags: [User Authentication]
      operationId: getCurrentUser
      x-phase: Final
      security: [{ UserAccessToken: [] }]
      responses:
        '200': { description: Current public user profile }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      x-phase: Final
      security: [{ UserAccessToken: [] }]
      responses:
        '200': { description: Current user's applications }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Applications]
      operationId: createApplication
      x-phase: Final
      security: [{ UserAccessToken: [], CsrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationCreate' }
      responses:
        '201': { description: Draft application created }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /applications/{id}:
    get:
      tags: [Applications]
      operationId: getApplication
      x-phase: Final
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Application details }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /courses:
    get:
      tags: [Courses]
      operationId: listCourses
      x-phase: Final
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Published course page }
        '422': { $ref: '#/components/responses/ValidationError' }
  /courses/{slug}:
    get:
      tags: [Courses]
      operationId: getCourse
      x-phase: Final
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200': { description: Published course details }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders:
    post:
      tags: [Commerce]
      operationId: createOrder
      x-phase: Final
      security: [{ UserAccessToken: [], CsrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201': { description: Server-priced order created }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    StaffSession:
      type: apiKey
      in: cookie
      name: jahan_staff_session
    UserAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshToken:
      type: apiKey
      in: cookie
      name: jahan_refresh
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^(W/)?"[1-9][0-9]*"$' }
    ReferenceKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [countries, cities, academic-levels, fields-of-study, intakes, currencies]
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    Locale:
      name: locale
      in: query
      schema: { type: string, enum: [fa, en], default: fa }
    Search:
      name: q
      in: query
      schema: { type: string, minLength: 2, maxLength: 100 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    PreconditionRequired:
      description: If-Match is required for this mutation
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PreconditionFailed:
      description: The supplied version is stale; reload the item before retrying
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ReferenceDataPage:
      description: Localized reference-data page
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReferenceDataPage' }
    ReferenceDataItem:
      description: Reference-data item including both translations for staff callers
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/ReferenceDataItem' }
    UniversityPage:
      description: Published universities
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UniversitySummary' }
    ProgramPage:
      description: Published programs
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProgramSummary' }
    ArticlePage:
      description: Published articles
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ArticleSummary' }
    Unauthorized:
      description: Authentication required or invalid
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Authenticated but not permitted
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Resource does not exist or is not visible to this caller
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Resource or idempotency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    InvalidRequest:
      description: Invalid, expired, or consumed token/request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationError:
      description: Request failed field or domain validation
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    DependencyUnavailable:
      description: Authoritative local persistence is unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    ReferenceTranslation:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: [string, 'null'], maxLength: 5000 }
    ReferenceTranslations:
      type: object
      additionalProperties: false
      required: [fa, en]
      properties:
        fa: { $ref: '#/components/schemas/ReferenceTranslation' }
        en: { $ref: '#/components/schemas/ReferenceTranslation' }
    ReferenceDataWrite:
      type: object
      description: Kind-specific write payload; unknown fields are rejected and fa/en are mandatory.
      required: [translations]
      properties:
        translations: { $ref: '#/components/schemas/ReferenceTranslations' }
        code: { type: string }
        iso2: { type: string, pattern: '^[A-Za-z]{2}$' }
        iso3: { type: [string, 'null'], pattern: '^[A-Za-z]{3}$' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        countryId: { $ref: '#/components/schemas/Uuid' }
        parentId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        status: { type: string, enum: [draft, published, archived] }
        active: { type: boolean }
        featured: { type: boolean }
        displayOrder: { type: integer, minimum: 0, maximum: 1000000 }
        numericCode: { type: [string, 'null'], pattern: '^\d{3}$' }
        symbol: { type: string, minLength: 1, maxLength: 12 }
        decimalPlaces: { type: integer, minimum: 0, maximum: 4 }
    ReferenceDataItem:
      type: object
      required: [id, type, code, name, active, displayOrder, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        active: { type: boolean }
        displayOrder: { type: integer }
        version: { type: integer, minimum: 1 }
        slug: { type: [string, 'null'] }
        countryId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        parentId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        status: { type: [string, 'null'] }
        translations: { $ref: '#/components/schemas/ReferenceTranslations' }
    ReferenceDataPage:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReferenceDataItem' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    Uuid:
      type: string
      format: uuid
    Meta:
      type: object
      additionalProperties: false
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    PageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: {} }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, fieldErrors, requestId]
          properties:
            code: { type: string, pattern: '^[A-Z][A-Z0-9_]+$' }
            message: { type: string }
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            requestId: { type: string }
    CountrySummary:
      type: object
      additionalProperties: false
      required: [id, slug, code, name, featured]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        code: { type: string, pattern: '^[A-Z]{2}$' }
        name: { type: string }
        featured: { type: boolean }
        imageUrl: { type: [string, 'null'], format: uri }
    CountryEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/CountrySummary' }
    UniversitySummary:
      type: object
      required: [id, slug, name, country]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        summary: { type: [string, 'null'] }
        country: { $ref: '#/components/schemas/CountrySummary' }
        city: { type: [string, 'null'] }
        institutionType: { type: [string, 'null'] }
        ranking: { type: [integer, 'null'], minimum: 1 }
        imageUrl: { type: [string, 'null'], format: uri }
    UniversityDetail:
      allOf:
        - $ref: '#/components/schemas/UniversitySummary'
        - type: object
          properties:
            body: { type: string }
            foundedYear: { type: [integer, 'null'], minimum: 1000, maximum: 3000 }
            websiteUrl: { type: [string, 'null'], format: uri }
    Tuition:
      oneOf:
        - type: object
          required: [type, amount, currency]
          properties:
            type: { const: EXACT }
            amount: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
        - type: object
          required: [type, minimum, maximum, currency]
          properties:
            type: { const: RANGE }
            minimum: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
            maximum: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
        - type: object
          required: [type]
          properties:
            type: { const: CONTACT }
    ProgramSummary:
      type: object
      required: [id, slug, name, university, level, tuition]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        summary: { type: [string, 'null'] }
        university: { $ref: '#/components/schemas/UniversitySummary' }
        level: { type: string }
        field: { type: [string, 'null'] }
        durationMonths: { type: [integer, 'null'], minimum: 1 }
        language: { type: [string, 'null'] }
        tuition: { $ref: '#/components/schemas/Tuition' }
    ProgramDetail:
      allOf:
        - $ref: '#/components/schemas/ProgramSummary'
        - type: object
          properties:
            body: { type: string }
            officialUrl: { type: [string, 'null'], format: uri }
            admissionRequirements: { type: array, items: { type: string } }
            intakes: { type: array, items: { type: object } }
    ArticleSummary:
      type: object
      required: [id, slug, title, excerpt, publishedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        coverImageUrl: { type: [string, 'null'], format: uri }
        publishedAt: { type: string, format: date-time }
    ArticleDetail:
      allOf:
        - $ref: '#/components/schemas/ArticleSummary'
        - type: object
          required: [body]
          properties:
            body: { type: string }
    ConsultationCreate:
      type: object
      additionalProperties: false
      description: Exactly one of desiredCountryId or desiredCountryText must be supplied.
      required:
        - firstName
        - lastName
        - mobile
        - intakeTerm
        - startYear
        - locale
        - source
        - privacyConsent
        - contactConsent
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        mobile: { type: string, minLength: 7, maxLength: 32 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        desiredCountryId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        desiredCountryText: { type: [string, 'null'], maxLength: 100 }
        intakeTerm: { type: string, enum: [spring, summer, fall, winter, unknown] }
        startYear: { type: integer, minimum: 2026, maximum: 2036 }
        age: { type: [integer, 'null'], minimum: 18, maximum: 100 }
        gender: { type: [string, 'null'], enum: [female, male, non_binary, self_described, prefer_not_to_say, null] }
        genderSelfDescription: { type: [string, 'null'], maxLength: 100 }
        occupation: { type: [string, 'null'], maxLength: 120 }
        maritalStatus: { type: [string, 'null'], enum: [single, married, divorced, widowed, prefer_not_to_say, null] }
        investmentBudget:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [rangeCode, currency]
              properties:
                rangeCode: { type: string, maxLength: 50 }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
        message: { type: [string, 'null'], maxLength: 2000 }
        locale: { type: string, enum: [fa, en] }
        source:
          type: object
          additionalProperties: false
          required: [pageUrl]
          properties:
            pageUrl: { type: string, maxLength: 2048, pattern: '^/' }
            entityType: { type: [string, 'null'], enum: [university, program, null] }
            entityId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        privacyConsent: { const: true }
        contactConsent: { const: true }
        website:
          type: [string, 'null']
          maxLength: 200
          writeOnly: true
          description: Bot-trap field; legitimate clients must leave it empty or omit it.
    ConsultationReceiptEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [reference, duplicate, receivedAt, message]
          properties:
            reference: { type: string, minLength: 8, maxLength: 32 }
            duplicate: { type: boolean }
            receivedAt: { type: string, format: date-time }
            message: { type: string }
    StaffLogin:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
    StaffEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, email, name, permissions]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            email: { type: string, format: email }
            name: { type: string }
            permissions: { type: array, items: { type: string } }
    LeadStatus:
      type: string
      enum: [new, assigned, contacted, qualified, not_qualified, converted, closed]
    SyncStatus:
      type: string
      enum: [pending, synced, failed]
    LeadSummary:
      type: object
      required: [id, reference, firstName, lastName, mobile, status, syncStatus, archived, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        mobile: { type: string }
        email: { type: [string, 'null'], format: email }
        desiredCountryId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        desiredCountryName: { type: [string, 'null'] }
        desiredCountryText: { type: [string, 'null'] }
        intakeTerm: { type: [string, 'null'], enum: [spring, summer, fall, winter, unknown, null] }
        startYear: { type: [integer, 'null'] }
        status: { $ref: '#/components/schemas/LeadStatus' }
        syncStatus: { $ref: '#/components/schemas/SyncStatus' }
        assignee: { type: [object, 'null'] }
        archived: { type: boolean }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LeadDetail:
      allOf:
        - $ref: '#/components/schemas/LeadSummary'
        - type: object
          required: [mobileRaw, locale, duplicateCount, syncAttemptCount]
          properties:
            mobileRaw: { type: string }
            age: { type: [integer, 'null'], minimum: 18, maximum: 100 }
            gender: { type: [string, 'null'], enum: [female, male, non_binary, self_described, prefer_not_to_say, null] }
            genderSelfDescription: { type: [string, 'null'], maxLength: 100 }
            occupation: { type: [string, 'null'] }
            maritalStatus: { type: [string, 'null'], enum: [single, married, divorced, widowed, prefer_not_to_say, null] }
            investmentRangeCode: { type: [string, 'null'] }
            investmentCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
            message: { type: [string, 'null'] }
            locale: { type: string, enum: [fa, en] }
            sourceUrl: { type: [string, 'null'] }
            sourceUniversityId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
            sourceProgramId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
            duplicateCount: { type: integer, minimum: 0 }
            lastDuplicateAt: { type: [string, 'null'], format: date-time }
            syncExternalId: { type: [string, 'null'] }
            syncAttemptCount: { type: integer, minimum: 0 }
            syncLastAttemptAt: { type: [string, 'null'], format: date-time }
            syncSyncedAt: { type: [string, 'null'], format: date-time }
            archiveReason: { type: [string, 'null'] }
            archivedAt: { type: [string, 'null'], format: date-time }
            archivedByUserId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    LeadUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        mobile: { type: string, minLength: 7, maxLength: 32 }
        email: { type: [string, 'null'], format: email }
        desiredCountryId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        desiredCountryText: { type: [string, 'null'], maxLength: 100 }
        intakeTerm: { type: string, enum: [spring, summer, fall, winter, unknown] }
        startYear: { type: integer }
        age: { type: [integer, 'null'], minimum: 18, maximum: 100 }
        gender: { type: [string, 'null'], enum: [female, male, non_binary, self_described, prefer_not_to_say, null] }
        genderSelfDescription: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        occupation: { type: [string, 'null'], maxLength: 120 }
        maritalStatus: { type: [string, 'null'], enum: [single, married, divorced, widowed, prefer_not_to_say, null] }
        investmentBudget:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [rangeCode, currency]
              properties:
                rangeCode: { type: string, minLength: 1, maxLength: 60, pattern: '^[A-Za-z0-9_-]+$' }
                currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        message: { type: [string, 'null'], maxLength: 2000 }
        locale: { type: string, enum: [fa, en] }
    LeadArchiveRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    LeadAssignmentRequest:
      type: object
      additionalProperties: false
      required: [consultantId]
      properties:
        consultantId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: [string, 'null'], minLength: 3, maxLength: 500 }
    LeadStatusTransitionRequest:
      type: object
      additionalProperties: false
      required: [toStatus]
      properties:
        toStatus: { $ref: '#/components/schemas/LeadStatus' }
        reason: { type: [string, 'null'], minLength: 3, maxLength: 500 }
    LeadAssignmentHistoryItem:
      type: object
      required: [id, consultantId, assignedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        consultantId: { $ref: '#/components/schemas/Uuid' }
        assignedByUserId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        assignedAt: { type: string, format: date-time }
        unassignedAt: { type: [string, 'null'], format: date-time }
        endedByUserId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        reason: { type: [string, 'null'] }
    LeadStatusHistoryItem:
      type: object
      required: [id, newStatus, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        oldStatus:
          oneOf:
            - $ref: '#/components/schemas/LeadStatus'
            - type: 'null'
        newStatus: { $ref: '#/components/schemas/LeadStatus' }
        actorUserId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        reason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    LeadHistory:
      type: object
      required: [assignments, statuses]
      properties:
        assignments:
          type: array
          items: { $ref: '#/components/schemas/LeadAssignmentHistoryItem' }
        statuses:
          type: array
          items: { $ref: '#/components/schemas/LeadStatusHistoryItem' }
    NouraRetryRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: [string, 'null'], minLength: 3, maxLength: 500 }
    NouraRetryReceipt:
      type: object
      required: [status, attemptCount, manualRetryCount, nextAttemptAt]
      properties:
        status: { type: string, const: pending }
        attemptCount: { type: integer, minimum: 0 }
        manualRetryCount: { type: integer, minimum: 1 }
        nextAttemptAt: { type: string, format: date-time }
    UserRegister:
      type: object
      additionalProperties: false
      required: [email, password, firstName, lastName, locale, acceptedTermsVersion, acceptedPrivacyVersion]
      properties:
        email: { type: string, format: email, maxLength: 254 }
