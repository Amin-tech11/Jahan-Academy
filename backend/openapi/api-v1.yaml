            investmentRangeCode: { type: [string, 'null'] }
            investmentCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
            message: { type: [string, 'null'] }
            locale: { type: string, enum: [fa, en] }
            sourceUrl: { type: [string, 'null'] }
            sourceUniversityId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
            sourceProgramId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
            duplicateCount: { type: integer, minimum: 0 }
