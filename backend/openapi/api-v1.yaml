openapi: 3.1.0
info:
  title: Jahan Academy API
  version: 1.0.0-draft
  description: Contract-first API. x-phase identifies MVP and later complete-product operations.
servers:
  - url: /api/v1
tags:
  - name: Reference Data
  - name: Public Catalog
  - name: Consultations
  - name: Staff Authentication
  - name: Lead Operations
  - name: Media
  - name: User Authentication
  - name: Staff Administration
  - name: Applications
  - name: Courses
  - name: Commerce
  - name: FAQs
  - name: SEO
  - name: Reporting
  - name: Public Experience
  - name: Public Experience Administration
paths:
  /public/home:
    get:
      tags: [Public Experience]
      operationId: getPublicHomeExperience
      x-phase: MVP
      parameters:
        - { name: locale, in: query, schema: { type: string, enum: [fa, en], default: fa } }
      responses:
        '200': { description: Published bilingual Home composition with only lead-generation blocks }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/pages/{slug}:
    get:
      tags: [Public Experience]
      operationId: getPublicPageExperience
      x-phase: MVP
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
        - { name: locale, in: query, schema: { type: string, enum: [fa, en], default: fa } }
      responses:
        '200': { description: Published static or service page with localized SEO fields }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/country-guides:
    get:
      tags: [Public Experience]
      operationId: listPublicCountryGuides
      x-phase: MVP
      parameters:
        - { name: locale, in: query, schema: { type: string, enum: [fa, en], default: fa } }
      responses:
        '200': { description: Published country-guide cards only }
  /public/country-guides/{countrySlug}:
    get:
      tags: [Public Experience]
      operationId: getPublicCountryGuide
      x-phase: MVP
      parameters:
        - { name: countrySlug, in: path, required: true, schema: { type: string } }
        - { name: locale, in: query, schema: { type: string, enum: [fa, en], default: fa } }
      responses:
        '200': { description: Published structured country guide with facts, sections, sources, and CTA-ready content }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/public-pages:
    get:
      tags: [Public Experience Administration]
      operationId: listPublicPages
      x-phase: MVP
      x-permissions: [content.read]
      security: [{ StaffSession: [] }]
      responses: { '200': { description: All public-page drafts, published pages, and archives } }
    post:
      tags: [Public Experience Administration]
      operationId: createPublicPage
      x-phase: MVP
      x-permissions: [content.write]
      security: [{ StaffSession: [] }]
      responses: { '201': { description: Bilingual page draft created } }
  /admin/country-guides:
    get:
      tags: [Public Experience Administration]
      operationId: listCountryGuides
      x-phase: MVP
      x-permissions: [content.read]
      security: [{ StaffSession: [] }]
      responses: { '200': { description: All country-guide lifecycle records } }
    post:
      tags: [Public Experience Administration]
      operationId: createCountryGuide
      x-phase: MVP
      x-permissions: [content.write]
      security: [{ StaffSession: [] }]
      responses: { '201': { description: Bilingual country-guide draft created } }
  /reporting/dashboard:
    get:
      tags: [Reporting]
      operationId: getTemporaryAdminDashboard
      x-phase: MVP
      x-permissions: [report.read]
      security: [{ StaffSession: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Read-only local-temporary operational dashboard; Noura ERP will become the reporting authority }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /seo/entities/{resource}/{slug}/metadata:
    get:
      tags: [SEO]
      operationId: getEntitySeoMetadata
      x-phase: MVP
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string, enum: [country, university, article] } }
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
        - { name: locale, in: query, schema: { type: string, enum: [fa, en], default: fa } }
      responses:
        '200': { description: Localized canonical metadata, hreflang links, and visible-content JSON-LD }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /seo/listings/{resource}/metadata:
    get:
      tags: [SEO]
      operationId: getListingSeoMetadata
      x-phase: MVP
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string, enum: [universities, articles] } }
        - { name: locale, in: query, schema: { type: string, enum: [fa, en], default: fa } }
      responses:
        '200': { description: Listing metadata; any query filter returns noindex,follow and an unfiltered canonical }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/media/upload-intents:
    post:
      tags: [Media]
      operationId: createMediaUploadIntent
      x-phase: MVP
      x-permissions: [media.write]
      security: [{ UserAccessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadIntentRequest' }
      responses:
        '201': { description: Short-lived direct upload authorization }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: File exceeds the purpose-specific limit }
        '415': { description: Media type is not permitted }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/media:
    get:
      tags: [Media]
      operationId: listMediaAssets
      x-phase: MVP
      x-permissions: [media.read]
      security: [{ UserAccessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - { name: purpose, in: query, schema: { $ref: '#/components/schemas/MediaPurpose' } }
        - { name: upload_status, in: query, schema: { $ref: '#/components/schemas/MediaUploadStatus' } }
        - { name: mime_type, in: query, schema: { type: string } }
      responses:
        '200': { description: Paginated media assets }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/media/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Media]
      operationId: getMediaAsset
      x-phase: MVP
      x-permissions: [media.read]
      security: [{ UserAccessToken: [] }]
      responses:
        '200': { description: Media asset and current ETag }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Media]
      operationId: updateMediaMetadata
      x-phase: MVP
      x-permissions: [media.write]
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaMetadataUpdate' }
      responses:
        '200': { description: Updated media asset }
        '412': { description: Stale version }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Media]
      operationId: deleteMediaAsset
      x-phase: MVP
      x-permissions: [media.write]
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Deleted }
        '409': { description: Asset is attached to another resource }
        '412': { description: Stale version }
  /admin/media/{id}/confirm:
    post:
      tags: [Media]
      operationId: confirmMediaUpload
      x-phase: MVP
      x-permissions: [media.write]
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaConfirmRequest' }
      responses:
        '202': { description: Validated, scanned, and ready public media asset }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: Upload intent expired }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Storage or malware scanner unavailable }
  /media/{id}/content:
    get:
      tags: [Media]
      operationId: resolvePublicMedia
      x-phase: MVP
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '307': { description: Redirect to a short-lived object URL }
        '404': { $ref: '#/components/responses/NotFound' }
  /reference-data/{kind}:
    get:
      tags: [Reference Data]
      operationId: listReferenceData
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: countryId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: parentId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { $ref: '#/components/responses/ReferenceDataPage' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/reference-data/{kind}:
    get:
      tags: [Reference Data]
      operationId: listAdminReferenceData
      x-phase: MVP
      x-permissions: [reference_data.read]
      security: [{ UserAccessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ReferenceDataPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Reference Data]
      operationId: createReferenceData
      x-phase: MVP
      x-permissions: [reference_data.write]
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ReferenceKind' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceDataWrite' }
      responses:
        '201': { $ref: '#/components/responses/ReferenceDataItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/reference-data/{kind}/{id}:
    parameters:
      - $ref: '#/components/parameters/ReferenceKind'
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reference Data]
      operationId: getAdminReferenceData
      x-phase: MVP
      x-permissions: [reference_data.read]
      security: [{ UserAccessToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/ReferenceDataItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Reference Data]
      operationId: replaceReferenceData
      x-phase: MVP
      x-permissions: [reference_data.write]
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceDataWrite' }
      responses:
        '200': { $ref: '#/components/responses/ReferenceDataItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Reference Data]
      operationId: archiveReferenceData
      x-phase: MVP
      x-permissions: [reference_data.write]
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/ReferenceDataItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /countries:
    get:
      tags: [Public Catalog]
      operationId: listCountries
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: featured
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Published countries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CountrySummary' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /countries/{slug}:
    get:
      tags: [Public Catalog]
      operationId: getCountry
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Published country
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryEnvelope'
        '404': { $ref: '#/components/responses/NotFound' }
  /universities:
    get:
      tags: [Public Catalog]
      operationId: listUniversities
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - { name: country, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: ranking, in: query, schema: { type: integer, minimum: 1 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, ranking, -ranking] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/UniversityPage' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /universities/{slug}:
    get:
      tags: [Public Catalog]
      operationId: getUniversity
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Published university details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UniversityDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /universities/{slug}/related:
    get:
      tags: [Public Catalog]
      operationId: listRelatedUniversities
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Locale'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 6 } }
      responses:
        '200':
          description: Ranked related published universities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelatedEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /discovery/suggestions:
    get:
      tags: [Public Catalog]
      operationId: suggestCatalogResults
      x-phase: MVP
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - $ref: '#/components/parameters/Locale'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 8 } }
      responses:
        '200':
          description: Ranked localized catalog suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /articles:
    get:
      tags: [Public Catalog]
      operationId: listArticles
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - { name: type, in: query, schema: { type: string, enum: [article, news, guide] } }
        - { name: categoryId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: tagId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: authorId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, newest, oldest, title_asc, title_desc] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ArticlePage' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /articles/{slug}:
    get:
      tags: [Public Catalog]
      operationId: getArticle
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Published article
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ArticleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /content/{resource}:
    get:
      tags: [Public Catalog]
      operationId: listContentReferences
      x-phase: MVP
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string, enum: [categories, tags, authors] } }
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Published localized content references }
        '422': { $ref: '#/components/responses/ValidationError' }
  /content/{resource}/{slug}:
    get:
      tags: [Public Catalog]
      operationId: getContentReference
      x-phase: MVP
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string, enum: [categories, tags, authors] } }
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200': { description: Published localized content reference }
        '404': { $ref: '#/components/responses/NotFound' }
  /faqs:
    get:
      tags: [FAQs]
      operationId: listFaqs
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: targetType, in: query, schema: { type: string, enum: [general, university, program, service], default: general } }
        - { name: targetId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - $ref: '#/components/parameters/Page'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/FaqPage' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /faqs/{id}:
    get:
      tags: [FAQs]
      operationId: getFaq
      x-phase: MVP
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Published localized FAQ
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Faq' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/faqs:
    get:
      tags: [FAQs]
      operationId: listAdminFaqs
      x-phase: MVP
      x-permissions: [content.read]
      security: [{ UserAccessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Search'
        - { name: targetType, in: query, schema: { type: string, enum: [general, university, program, service] } }
        - { name: targetId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, archived] } }
        - { name: sort, in: query, schema: { type: string, enum: [display_order, updated_desc, question_asc] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/FaqPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [FAQs]
      operationId: createFaq
      x-phase: MVP
      x-permissions: [content.write]
      security: [{ UserAccessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaqWrite' }
      responses:
        '201': { description: Draft FAQ with ETag }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/faqs/order:
    put:
      tags: [FAQs]
      operationId: reorderFaqs
      x-phase: MVP
      x-permissions: [content.write]
      security: [{ UserAccessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaqReorder' }
      responses:
        '204': { description: Target-specific order updated atomically }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/faqs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [FAQs]
      operationId: getAdminFaq
      x-phase: MVP
      x-permissions: [content.read]
      security: [{ UserAccessToken: [] }]
      responses:
        '200': { description: FAQ with all translations, assignments, and ETag }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [FAQs]
      operationId: replaceFaq
      x-phase: MVP
      x-permissions: [content.write]
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaqWrite' }
      responses:
        '200': { description: Updated FAQ and ETag }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [FAQs]
      operationId: deleteDraftFaq
      x-phase: MVP
      x-permissions: [content.write]
      security: [{ UserAccessToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Draft FAQ deleted }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /admin/faqs/{id}/publish:
    post:
      tags: [FAQs]
      operationId: publishFaq
      x-phase: MVP
      x-permissions: [content.publish]
      security: [{ UserAccessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Published FAQ and ETag }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/faqs/{id}/archive:
    post:
      tags: [FAQs]
      operationId: archiveFaq
      x-phase: MVP
      x-permissions: [content.publish]
      security: [{ UserAccessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
