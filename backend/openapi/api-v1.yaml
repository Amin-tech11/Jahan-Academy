components:
  securitySchemes:
    StaffSession:
      type: apiKey
      in: cookie
      name: jahan_staff_session
    UserAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshToken:
      type: apiKey
      in: cookie
      name: jahan_refresh
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^(W/)?"[1-9][0-9]*"$' }
    ReferenceKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [countries, cities, academic-levels, fields-of-study, intakes, currencies]
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    Locale:
      name: locale
      in: query
      schema: { type: string, enum: [fa, en], default: fa }
    Search:
      name: q
      in: query
      schema: { type: string, minLength: 2, maxLength: 100 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    PreconditionRequired:
      description: If-Match is required for this mutation
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PreconditionFailed:
      description: The supplied version is stale; reload the item before retrying
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ReferenceDataPage:
      description: Localized reference-data page
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReferenceDataPage' }
    ReferenceDataItem:
      description: Reference-data item including both translations for staff callers
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/ReferenceDataItem' }
    UniversityPage:
      description: Published universities
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UniversitySummary' }
    ProgramPage:
      description: Published programs
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProgramSummary' }
    ArticlePage:
      description: Published articles
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ArticleSummary' }
    FaqPage:
      description: Published localized FAQs in target display order
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Faq' }
    Unauthorized:
      description: Authentication required or invalid
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Authenticated but not permitted
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Resource does not exist or is not visible to this caller
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Resource or idempotency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    InvalidRequest:
      description: Invalid, expired, or consumed token/request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationError:
      description: Request failed field or domain validation
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    DependencyUnavailable:
      description: Authoritative local persistence is unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    StaffRoleCode:
      type: string
      enum: [super_admin, support, consultant, content_editor]
    StaffRole:
      type: object
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/StaffRoleCode' }
    StaffCreate:
      type: object
      additionalProperties: false
      required: [email, firstName, lastName, roleCodes]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        preferredLocale: { type: string, enum: [fa, en], default: fa }
        roleCodes:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/StaffRoleCode' }
    StaffUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        preferredLocale: { type: string, enum: [fa, en] }
        active: { type: boolean }
    StaffRolesUpdate:
      type: object
      additionalProperties: false
      required: [roleCodes]
      properties:
        roleCodes:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/StaffRoleCode' }
    StaffAccessRecovery:
      type: object
      additionalProperties: false
      properties:
        reactivate: { type: boolean, default: false }
    StaffView:
      type: object
      required:
        [id, email, firstName, lastName, preferredLocale, status, active, emailVerified, roles, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        preferredLocale: { type: string, enum: [fa, en] }
        status: { type: string, enum: [active, disabled, locked] }
        active: { type: boolean }
        emailVerified: { type: boolean }
        roles: { type: array, items: { $ref: '#/components/schemas/StaffRole' } }
        lockedUntil: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    StaffEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/StaffView' }
    StaffPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StaffView' } }
        meta:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page: { type: integer, minimum: 1 }
            limit: { type: integer, minimum: 1, maximum: 100 }
            total: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
    ReferenceTranslation:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: [string, 'null'], maxLength: 5000 }
    ReferenceTranslations:
      type: object
      additionalProperties: false
      required: [fa, en]
      properties:
        fa: { $ref: '#/components/schemas/ReferenceTranslation' }
        en: { $ref: '#/components/schemas/ReferenceTranslation' }
    ReferenceDataWrite:
      type: object
      description: Kind-specific write payload; unknown fields are rejected and fa/en are mandatory.
      required: [translations]
      properties:
        translations: { $ref: '#/components/schemas/ReferenceTranslations' }
        code: { type: string }
        iso2: { type: string, pattern: '^[A-Za-z]{2}$' }
        iso3: { type: [string, 'null'], pattern: '^[A-Za-z]{3}$' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        countryId: { $ref: '#/components/schemas/Uuid' }
        parentId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        status: { type: string, enum: [draft, published, archived] }
        active: { type: boolean }
        featured: { type: boolean }
        displayOrder: { type: integer, minimum: 0, maximum: 1000000 }
        numericCode: { type: [string, 'null'], pattern: '^\d{3}$' }
        symbol: { type: string, minLength: 1, maxLength: 12 }
        decimalPlaces: { type: integer, minimum: 0, maximum: 4 }
    ReferenceDataItem:
      type: object
      required: [id, type, code, name, active, displayOrder, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        active: { type: boolean }
        displayOrder: { type: integer }
        version: { type: integer, minimum: 1 }
        slug: { type: [string, 'null'] }
        countryId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        parentId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        status: { type: [string, 'null'] }
        translations: { $ref: '#/components/schemas/ReferenceTranslations' }
    ReferenceDataPage:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReferenceDataItem' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    Uuid:
      type: string
      format: uuid
    MediaPurpose:
      type: string
      enum: [logo, university_image, article_image, public_file]
    MediaUploadStatus:
      type: string
      enum: [pending, processing, ready, rejected]
    MediaUploadIntentRequest:
      type: object
      additionalProperties: false
      required: [filename, mimeType, sizeBytes, purpose]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 26214400 }
        purpose: { $ref: '#/components/schemas/MediaPurpose' }
        altFa: { type: [string, 'null'], maxLength: 300 }
        altEn: { type: [string, 'null'], maxLength: 300 }
        sourceUrl: { type: [string, 'null'], maxLength: 2000 }
        attribution: { type: [string, 'null'], maxLength: 1000 }
    MediaConfirmRequest:
      type: object
      additionalProperties: false
      required: [checksumSha256]
      properties:
        checksumSha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    MediaMetadataUpdate:
      type: object
      additionalProperties: false
      properties:
        altFa: { type: [string, 'null'], maxLength: 300 }
        altEn: { type: [string, 'null'], maxLength: 300 }
        sourceUrl: { type: [string, 'null'], maxLength: 2000 }
        attribution: { type: [string, 'null'], maxLength: 1000 }
    Meta:
      type: object
      additionalProperties: false
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    PageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: {} }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, fieldErrors, requestId]
          properties:
            code: { type: string, pattern: '^[A-Z][A-Z0-9_]+$' }
            message: { type: string }
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            requestId: { type: string }
    CountrySummary:
      type: object
      additionalProperties: false
      required: [id, slug, code, name, featured]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        code: { type: string, pattern: '^[A-Z]{2}$' }
        name: { type: string }
        featured: { type: boolean }
        imageUrl: { type: [string, 'null'], format: uri }
    CountryEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/CountrySummary' }
    UniversitySummary:
      type: object
      required: [id, slug, name, country]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        summary: { type: [string, 'null'] }
        country: { $ref: '#/components/schemas/CountrySummary' }
        city: { type: [string, 'null'] }
        institutionType: { type: [string, 'null'] }
        ranking: { type: [integer, 'null'], minimum: 1 }
        imageUrl: { type: [string, 'null'], format: uri }
    UniversityDetail:
      allOf:
        - $ref: '#/components/schemas/UniversitySummary'
        - type: object
          properties:
            body: { type: string }
            foundedYear: { type: [integer, 'null'], minimum: 1000, maximum: 3000 }
            websiteUrl: { type: [string, 'null'], format: uri }
    Tuition:
      oneOf:
        - type: object
          required: [type, amount, currency]
          properties:
            type: { const: EXACT }
            amount: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
        - type: object
          required: [type, minimum, maximum, currency]
          properties:
            type: { const: RANGE }
            minimum: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
            maximum: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
        - type: object
          required: [type]
          properties:
            type: { const: CONTACT }
    ProgramSummary:
      type: object
      required: [id, slug, name, university, level, tuition]
