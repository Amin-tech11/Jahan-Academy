        status: { type: string, enum: [draft, published, archived] }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    FaqTranslation:
      type: object
      additionalProperties: false
      required: [question, answer]
      properties:
        question: { type: string, minLength: 3, maxLength: 500 }
        answer: { type: string, minLength: 3, maxLength: 50000 }
    FaqAssignment:
      type: object
      additionalProperties: false
      required: [targetType, displayOrder]
      properties:
        targetType: { type: string, enum: [general, university, program, service] }
        targetId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
