      required: [id, question, answer, assignments, status, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        question: { type: string }
        answer: { type: string }
        assignments:
          type: array
          items:
            type: object
            required: [targetType, displayOrder]
            properties:
              targetType: { type: string, enum: [general, university, program, service] }
