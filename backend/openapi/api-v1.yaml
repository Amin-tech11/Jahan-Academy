        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        summary: { type: [string, 'null'] }
        university: { $ref: '#/components/schemas/UniversitySummary' }
        level: { type: string }
        field: { type: [string, 'null'] }
        durationMonths: { type: [integer, 'null'], minimum: 1 }
        language: { type: [string, 'null'] }
        tuition: { $ref: '#/components/schemas/Tuition' }
    ProgramDetail:
      allOf:
        - $ref: '#/components/schemas/ProgramSummary'
        - type: object
